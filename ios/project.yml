name: TravelMemory
options:
  bundleIdPrefix: ai.deepsleeptt
  deploymentTarget:
    iOS: "17.0"
targets:
  TravelMemory:
    type: application
    platform: iOS
    sources:
      - path: TravelMemory
    info:
      path: TravelMemory/Info.plist
      properties:
        CFBundleDisplayName: 行驿
        NSLocationWhenInUseUsageDescription: 用于识别你的出发城市，规划前往目的地的路线。
        NSPhotoLibraryUsageDescription: 扫描已授权相册的时间与位置以发现过往旅行；仅在你选择旅行后，将相关照片上传到私有旅行服务器分析。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            spark-82.tailb7a50b.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepsleeptt.travelmemory
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
