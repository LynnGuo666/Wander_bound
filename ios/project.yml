name: TravelMemory
options:
  bundleIdPrefix: ai.deepsleeptt
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftUIX:
    url: https://github.com/SwiftUIX/SwiftUIX.git
    revision: 3a99044b7045fb5907a7df18c7fe323e5656c6ab
targets:
  TravelMemory:
    type: application
    platform: iOS
    sources:
      - path: TravelMemory
    info:
      path: TravelMemory/Info.plist
      properties:
        CFBundleDisplayName: 旅忆
        NSLocationWhenInUseUsageDescription: 用于识别你的出发城市，规划前往目的地的路线。
        NSPhotoLibraryUsageDescription: 按你选择的旅程日期读取照片；仅在你确认后将所选照片上传到私有旅行服务器。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            spark-82.tailb7a50b.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepsleeptt.travelmemory
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SwiftUIX
    scheme:
      testTargets: []
