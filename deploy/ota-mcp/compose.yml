services:
  ota-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4176:4176"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "4176"
  rail-mcp:
    build: ../rail-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:4177:4177"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  dida-mcp:
    build: ../dida-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:4178:4178"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "4178"
